[versions]
agp                 = "9.5.0"
kotlin              = "2.4.21"
ksp                 = "2.3.12"
compose-bom         = "2024.12.01"
activity-compose    = "1.9.3"
lifecycle           = "2.8.7"
navigation          = "2.10.2"
room                = "2.8.5"
datastore           = "1.3.0"
retrofit            = "3.0.0"
okhttp              = "5.5.1"
kotlinx-serial      = "1.12.0"
retrofit-serial     = "1.0.0"
coroutines          = "1.11.0"
workmanager         = "2.12.0"
osmdroid            = "6.1.20"
core-ktx            = "1.19.1"
activity-recognition = "21.4.0"

[libraries]
# Core
core-ktx                    = { group = "androidx.core",           name = "core-ktx",                      version.ref = "core-ktx" }

# Compose
compose-bom                 = { group = "androidx.compose",        name = "compose-bom",                   version.ref = "compose-bom" }
compose-ui                  = { group = "androidx.compose.ui",     name = "ui" }
compose-ui-tooling-preview  = { group = "androidx.compose.ui",     name = "ui-tooling-preview" }
compose-ui-tooling          = { group = "androidx.compose.ui",     name = "ui-tooling" }
compose-material3           = { group = "androidx.compose.material3", name = "material3" }
compose-icons               = { group = "androidx.compose.material", name = "material-icons-extended" }
activity-compose            = { group = "androidx.activity",       name = "activity-compose",              version.ref = "activity-compose" }
navigation-compose          = { group = "androidx.navigation",     name = "navigation-compose",            version.ref = "navigation" }

# Lifecycle
lifecycle-viewmodel-compose = { group = "androidx.lifecycle",      name = "lifecycle-viewmodel-compose",   version.ref = "lifecycle" }
lifecycle-runtime-compose   = { group = "androidx.lifecycle",      name = "lifecycle-runtime-compose",     version.ref = "lifecycle" }

# Room
room-runtime                = { group = "androidx.room",           name = "room-runtime",                  version.ref = "room" }
room-ktx                    = { group = "androidx.room",           name = "room-ktx",                      version.ref = "room" }
room-compiler               = { group = "androidx.room",           name = "room-compiler",                 version.ref = "room" }

# DataStore
datastore-prefs             = { group = "androidx.datastore",      name = "datastore-preferences",         version.ref = "datastore" }

# Network
retrofit                    = { group = "com.squareup.retrofit2",  name = "retrofit",                      version.ref = "retrofit" }
retrofit-kotlin-serial      = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofit-serial" }
okhttp                      = { group = "com.squareup.okhttp3",    name = "okhttp",                        version.ref = "okhttp" }
okhttp-logging              = { group = "com.squareup.okhttp3",    name = "logging-interceptor",           version.ref = "okhttp" }
kotlinx-serialization       = { group = "org.jetbrains.kotlinx",  name = "kotlinx-serialization-json",    version.ref = "kotlinx-serial" }

# Coroutines
coroutines-android          = { group = "org.jetbrains.kotlinx",  name = "kotlinx-coroutines-android",    version.ref = "coroutines" }

# WorkManager
workmanager                 = { group = "androidx.work",           name = "work-runtime-ktx",              version.ref = "workmanager" }

# Maps
osmdroid                    = { group = "org.osmdroid",            name = "osmdroid-android",              version.ref = "osmdroid" }

# Activity Recognition
play-activity-recognition   = { group = "com.google.android.gms",  name = "play-services-location",        version.ref = "activity-recognition" }

[plugins]
android-application     = { id = "com.android.application",                version.ref = "agp" }
kotlin-android          = { id = "org.jetbrains.kotlin.android",            version.ref = "kotlin" }
kotlin-compose          = { id = "org.jetbrains.kotlin.plugin.compose",     version.ref = "kotlin" }
kotlin-serialization    = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                     = { id = "com.google.devtools.ksp",                 version.ref = "ksp" }
