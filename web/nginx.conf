server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Raise limits for batch API payloads from the mobile app
    client_max_body_size 10m;

    # Proxy all /api/* to the .NET backend service on the Docker network
    location /api/ {
        proxy_pass         http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Generous timeout for large range queries
        proxy_read_timeout 30s;
    }

    # SPA fallback — route all other paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
